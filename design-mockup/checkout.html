<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — OpenBook Store</title><script src="https://cdn.tailwindcss.com"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-ink">
<div id="splash">
  <div class="fanbook">
    <div class="base"></div>
    <div class="leaf" style="--ang:-55deg;"></div>
    <div class="leaf" style="--ang:-30deg;"></div>
    <div class="leaf" style="--ang:-8deg;"></div>
    <div class="leaf" style="--ang:15deg;"></div>
    <div class="leaf" style="--ang:38deg;"></div>
  </div>
  <span class="brandmark">OpenBook Store</span>
</div>

<div id="site-header"></div>

<section class="max-w-3xl mx-auto px-6 py-12">
  <h1 class="font-serif font-semibold text-3xl mb-6">Billing Details</h1>
  <div class="bg-rust/10 border border-rust text-rust text-xs p-4 mb-6">Demo checkout — no real payment is processed. A live version needs Stripe (or similar) wired to a real backend.</div>
  <form onsubmit="event.preventDefault(); simulatePurchase();" class="grid md:grid-cols-2 gap-4 bg-white border border-sand p-6">
    <input required placeholder="Full name" class="border border-sand px-4 py-3 text-sm md:col-span-2">
    <input required type="email" placeholder="Email (receipt sent here)" class="border border-sand px-4 py-3 text-sm md:col-span-2">
    <input required placeholder="Card number" class="border border-sand px-4 py-3 text-sm md:col-span-2">
    <input required placeholder="Expiry MM/YY" class="border border-sand px-4 py-3 text-sm">
    <input required placeholder="CVC" class="border border-sand px-4 py-3 text-sm">
    <button class="chip-cart px-6 py-3 nav-link md:col-span-2">Complete Purchase</button>
  </form>
</section>

<div id="site-footer"></div>
<div id="cartPanel" class="fixed top-0 right-0 h-full w-80 bg-cream border-l border-sand shadow-xl translate-x-full transition-transform z-50 flex flex-col">
  <div class="flex justify-between items-center p-5 border-b border-sand">
    <span class="font-serif font-semibold">Your Cart</span>
    <button onclick="toggleCart()" class="text-inksoft">Close</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
  <div class="p-5 border-t border-sand">
    <div class="flex justify-between text-sm mb-3"><span>Total</span><span id="cartTotal" class="font-semibold font-mono">$0.00</span></div>
    <a href="checkout.html" class="block text-center w-full chip-cart py-3 nav-link">Checkout</a>
  </div>
</div>

<div id="loginGate" class="fixed inset-0 bg-ink/70 hidden items-center justify-center z-50 p-6">
  <div class="bg-cream max-w-sm w-full p-8 border border-sand">
    <h3 class="font-serif font-semibold text-xl mb-2">Sign in to continue</h3>
    <p class="text-xs text-inksoft mb-6">This title is paid. Create an account or sign in to add it to your cart.</p>
    <button onclick="fakeLogin('Google')" class="w-full border border-sand py-3 text-sm mb-2 hover:border-rust">Continue with Google</button>
    <button onclick="fakeLogin('Facebook')" class="w-full border border-sand py-3 text-sm mb-2 hover:border-rust">Continue with Facebook</button>
    <button onclick="fakeLogin('Email')" class="w-full chip-fill py-3 text-sm mb-3">Continue with Email</button>
    <button onclick="hideLoginGate()" class="w-full text-xs text-inksoft">Cancel</button>
  </div>
</div>

<script src="shared.js"></script>
<script>renderHeader('catalog.html'); renderFooter();
  function simulatePurchase(){
    if(!cart.length){ alert('Your cart is empty.'); return; }
    owned = [...new Set([...owned, ...cart])];
    save('obs_owned', owned);
    const sales = JSON.parse(localStorage.getItem('obs_sales')||'[]');
    cart.forEach(id=>{
      const b = books.find(x=>x.id===id);
      sales.push({book:b.title, amount:b.price, date:new Date().toISOString()});
    });
    localStorage.setItem('obs_sales', JSON.stringify(sales));
    cart = []; save('obs_cart', cart);
    alert('Purchase complete! A confirmation and PDF would be emailed in the live version. View your receipt next.');
    location.href = 'receipt.html';
  }
</script>
</body></html>
