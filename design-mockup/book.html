<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Details — OpenBook Store</title><script src="https://cdn.tailwindcss.com"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-ink">
<div id="splash">
  <div class="fanbook">
    <div class="base"></div>
    <div class="leaf" style="--ang:-55deg;"></div>
    <div class="leaf" style="--ang:-30deg;"></div>
    <div class="leaf" style="--ang:-8deg;"></div>
    <div class="leaf" style="--ang:15deg;"></div>
    <div class="leaf" style="--ang:38deg;"></div>
  </div>
  <span class="brandmark">OpenBook Store</span>
</div>

<div id="site-header"></div>

<section class="max-w-4xl mx-auto px-6 py-12" id="bookDetail"></section>

<div id="site-footer"></div>
<div id="cartPanel" class="fixed top-0 right-0 h-full w-80 bg-cream border-l border-sand shadow-xl translate-x-full transition-transform z-50 flex flex-col">
  <div class="flex justify-between items-center p-5 border-b border-sand">
    <span class="font-serif font-semibold">Your Cart</span>
    <button onclick="toggleCart()" class="text-inksoft">Close</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
  <div class="p-5 border-t border-sand">
    <div class="flex justify-between text-sm mb-3"><span>Total</span><span id="cartTotal" class="font-semibold font-mono">$0.00</span></div>
    <a href="checkout.html" class="block text-center w-full chip-cart py-3 nav-link">Checkout</a>
  </div>
</div>

<div id="loginGate" class="fixed inset-0 bg-ink/70 hidden items-center justify-center z-50 p-6">
  <div class="bg-cream max-w-sm w-full p-8 border border-sand">
    <h3 class="font-serif font-semibold text-xl mb-2">Sign in to continue</h3>
    <p class="text-xs text-inksoft mb-6">This title is paid. Create an account or sign in to add it to your cart.</p>
    <button onclick="fakeLogin('Google')" class="w-full border border-sand py-3 text-sm mb-2 hover:border-rust">Continue with Google</button>
    <button onclick="fakeLogin('Facebook')" class="w-full border border-sand py-3 text-sm mb-2 hover:border-rust">Continue with Facebook</button>
    <button onclick="fakeLogin('Email')" class="w-full chip-fill py-3 text-sm mb-3">Continue with Email</button>
    <button onclick="hideLoginGate()" class="w-full text-xs text-inksoft">Cancel</button>
  </div>
</div>

<script src="shared.js"></script>
<script>renderHeader('catalog.html'); renderFooter();
  const id = parseInt(new URLSearchParams(location.search).get('id'));
  const b = books.find(x=>x.id===id);
  if(b){
    const freeBook = isFreeBook(b);
    const priceHtml = b.oldPrice ? `<span class="line-through text-inksoft mr-2">$${b.oldPrice}</span><span class="text-rust font-semibold font-mono text-xl">$${b.price}</span>` : (b.price===0 ? '<span class="text-good font-semibold font-mono text-xl">Free</span>' : `<span class="font-semibold font-mono text-xl">$${b.price}</span>`);
    document.getElementById('bookDetail').innerHTML = `
    <div class="grid md:grid-cols-2 gap-10">
      <img src="${b.cover}" class="w-full h-96 object-cover border border-sand">
      <div>
        <p class="font-mono text-xs text-rust uppercase mb-2">${b.category}</p>
        <h1 class="font-serif font-semibold text-3xl mb-2">${b.title}</h1>
        <p class="text-inksoft mb-1">by ${b.author} &middot; ${b.year}</p>
        <p class="text-inksoft text-sm mb-4">${b.pages} pages</p>
        <div class="mb-6">${priceHtml}</div>
        <p class="text-sm text-inksoft leading-relaxed mb-6">${b.desc}</p>
        <div class="border-t border-sand pt-4 mb-6">
          <p class="text-xs font-semibold uppercase text-inksoft mb-1">About the author</p>
          <p class="text-sm text-inksoft">${b.authorBio}</p>
        </div>
        <div class="flex gap-3">
          <button onclick="handleAdd(event, ${b.id})" class="px-6 py-3 nav-link ${freeBook?'border border-sand text-inksoft cursor-not-allowed':'chip-cart'}" ${freeBook?'disabled title="Free books do not use the cart"':''}>${freeBook?'Free access':'Add to Cart'}</button>
          <button onclick="toggleWish(event, ${b.id})" class="border px-6 py-3 nav-link ${freeBook?'border-sand text-inksoft cursor-not-allowed':'border-ink'}" ${freeBook?'disabled title="Free books cannot be wishlisted"':''}>${freeBook?'Wishlist unavailable':'+ Wishlist'}</button>
          <button onclick="toggleFav(event, ${b.id})" class="border border-ink px-4 py-3 text-lg">&#9733;</button>
        </div>
      </div>
    </div>`;
  } else { document.getElementById('bookDetail').innerHTML = '<p class="text-inksoft">Book not found.</p>'; }
</script>
</body></html>
