<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenBook Store — Ebooks &amp; Research, Sourced Legitimately</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EFE4;
    --cream-dim:#ECE5D5;
    --ink:#221D18;
    --ink-soft:#5C5348;
    --rust:#A8431C;
    --rust-deep:#7E3113;
    --sand:#D6C9AE;
    --sand-line:#DBD0BA;
    --white:#FBF9F3;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{color:inherit; text-decoration:none;}

  ::selection{background:var(--rust); color:var(--white);}

  /* ---------- Splash ---------- */
  #splash{
    position:fixed; inset:0;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
    z-index:999;
    transition:opacity 0.7s ease, visibility 0.7s ease;
  }
  #splash img{
    width:220px; max-width:60vw;
    opacity:0;
    transform:translateY(6px);
    animation:splashIn 0.8s ease forwards 0.15s;
  }
  #splash.hide{ opacity:0; visibility:hidden; }
  @keyframes splashIn{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Layout helpers ---------- */
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 40px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rust);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0;
    background:rgba(244,239,228,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--sand-line);
    z-index:50;
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px;
    max-width:1180px;
    margin:0 auto;
  }
  .brand{
    display:flex; align-items:center; gap:12px;
  }
  .brand img{ height:30px; width:auto; display:block; }
  .brand-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .nav-links{
    display:flex; align-items:center; gap:36px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .nav-links a{ transition:color 0.2s ease; }
  .nav-links a:hover{ color:var(--rust); }
  .nav-cta{
    background:var(--ink);
    color:var(--white) !important;
    padding:11px 22px;
    font-size:13px;
    font-weight:500;
    border:1px solid var(--ink);
  }
  .nav-cta:hover{ background:var(--rust); border-color:var(--rust); }
  .nav-toggle{ display:none; }

  /* ---------- Hero ---------- */
  .hero{
    padding:88px 40px 64px;
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:64px;
    align-items:end;
    border-bottom:1px solid var(--sand-line);
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(40px, 5vw, 64px);
    line-height:1.04;
    letter-spacing:-0.015em;
    margin-bottom:26px;
  }
  .hero h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--rust);
  }
  .hero p{
    font-size:17px;
    color:var(--ink-soft);
    max-width:46ch;
    margin-bottom:34px;
  }
  .hero-actions{ display:flex; gap:14px; margin-bottom:8px; }
  .btn{
    display:inline-block;
    padding:14px 26px;
    font-size:14px;
    font-weight:500;
    border:1px solid var(--ink);
    transition:all 0.2s ease;
  }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:var(--rust); border-color:var(--rust); }
  .btn-ghost{ background:transparent; color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--rust); color:var(--rust); }

  .hero-panel{
    border:1px solid var(--sand-line);
    background:var(--white);
    padding:28px;
  }
  .hero-panel .eyebrow{ margin-bottom:18px; display:block; }
  .stat-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:14px 0;
    border-bottom:1px solid var(--sand-line);
  }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row .label{ font-size:13px; color:var(--ink-soft); }
  .stat-row .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    font-weight:500;
  }

  /* ---------- Section shared ---------- */
  section{ padding:80px 0; }
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:44px;
    padding-bottom:20px;
    border-bottom:1px solid var(--sand-line);
  }
  .section-head h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:32px;
    letter-spacing:-0.01em;
  }
  .section-head p{
    font-size:14px;
    color:var(--ink-soft);
    max-width:34ch;
    text-align:right;
  }

  /* ---------- Sourcing columns ---------- */
  .sourcing{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border-top:1px solid var(--sand-line);
    border-left:1px solid var(--sand-line);
  }
  .source-col{
    padding:32px 30px;
    border-right:1px solid var(--sand-line);
    border-bottom:1px solid var(--sand-line);
  }
  .source-col .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--rust);
    letter-spacing:0.06em;
    margin-bottom:14px;
    display:block;
  }
  .source-col h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:20px;
    margin-bottom:10px;
  }
  .source-col p{
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- Ledger catalog ---------- */
  .ledger{ border-top:1px solid var(--ink); }
  .ledger-row{
    display:grid;
    grid-template-columns:40px 1fr 200px 140px 90px;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid var(--sand-line);
  }
  .ledger-row.head{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-top:14px;
    padding-bottom:14px;
  }
  .ledger-row .idx{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-row .title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:18px;
  }
  .ledger-row .author{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .ledger-row .source-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--rust);
  }
  .ledger-row .fmt{
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-row .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    text-align:right;
  }
  .ledger-row:hover{ background:var(--cream-dim); }

  /* ---------- CTA band ---------- */
  .cta-band{
    border-top:1px solid var(--sand-line);
    border-bottom:1px solid var(--sand-line);
    padding:70px 0;
    text-align:center;
  }
  .cta-band h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    margin-bottom:16px;
    letter-spacing:-0.01em;
  }
  .cta-band p{
    color:var(--ink-soft);
    margin-bottom:30px;
  }

  /* ---------- Footer ---------- */
  footer{
    padding:40px 0 50px;
  }
  .foot-row{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:24px;
    border-top:1px solid var(--sand-line);
    margin-top:24px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .foot-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:40px;
  }
  .foot-brand{ display:flex; align-items:center; gap:10px; }
  .foot-brand img{ height:22px; }
  .foot-links{ display:flex; gap:32px; font-size:13px; }
  .foot-links a{ color:var(--ink-soft); }
  .foot-links a:hover{ color:var(--rust); }

  @media (max-width: 860px){
    .nav{ padding:16px 24px; }
    .nav-links{ display:none; }
    .hero{ grid-template-columns:1fr; padding:64px 24px 48px; }
    .wrap{ padding:0 24px; }
    .sourcing{ grid-template-columns:1fr; }
    .ledger-row{ grid-template-columns:28px 1fr 90px; }
    .ledger-row .fmt, .ledger-row .source-tag{ display:none; }
    .section-head{ flex-direction:column; align-items:flex-start; gap:10px; }
    .section-head p{ text-align:left; }
    .foot-top{ flex-direction:column; }
  }

  @media (prefers-reduced-motion: reduce){
    #splash img{ animation:none; opacity:1; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
